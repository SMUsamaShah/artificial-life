<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artificial Life</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #ccc;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px 8px;
      gap: 8px;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }
    h1 { font-size: 15px; color: #888; letter-spacing: 3px; text-transform: uppercase; }
    header a { font-size: 11px; color: #555; text-decoration: none; }
    header a:hover { color: #888; }

    #controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      justify-content: center;
    }

    button {
      background: #161616;
      color: #bbb;
      border: 1px solid #333;
      padding: 4px 14px;
      cursor: pointer;
      border-radius: 3px;
      font-family: inherit;
      font-size: 12px;
      transition: background 0.1s, border-color 0.1s;
    }
    button:hover { background: #222; border-color: #555; }
    button.active { background: #1a2a1a; border-color: #3a7; color: #6c6; }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #111;
      padding: 4px 10px;
      border-radius: 3px;
      border: 1px solid #222;
    }
    .pill label { color: #666; white-space: nowrap; }
    .pill .val { color: #aaa; min-width: 54px; text-align: right; }

    input[type=range] {
      width: 80px;
      cursor: pointer;
      accent-color: #3a7;
    }
    input[type=number], select {
      background: #161616;
      color: #bbb;
      border: 1px solid #333;
      padding: 3px 6px;
      font-family: inherit;
      font-size: 12px;
      border-radius: 3px;
    }
    input[type=number] { width: 58px; }

    #stats {
      display: flex;
      gap: 18px;
      color: #555;
      font-size: 12px;
    }
    #stats .val { color: #999; }

    #canvas-wrap { position: relative; }
    canvas {
      display: block;
      border: 1px solid #1a1a1a;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
      max-width: 100vw;
      max-height: calc(100vh - 160px);
    }

    /* Zoom overlay for hovered program */
    #zoom {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(10,10,10,0.92);
      border: 1px solid #333;
      border-radius: 4px;
      padding: 8px;
      display: none;
      pointer-events: none;
      z-index: 10;
    }
    #zoom canvas {
      display: block;
      border: none;
      width: 80px;
      height: 80px;
    }
    #zoom-label {
      font-size: 10px;
      color: #666;
      text-align: center;
      margin-top: 4px;
      line-height: 1.4;
    }

    #legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      font-size: 11px;
      color: #666;
    }
    .li {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .lc {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    #tooltip {
      position: fixed;
      background: #111;
      border: 1px solid #333;
      padding: 8px 12px;
      font-size: 11px;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      z-index: 100;
      line-height: 1.8;
      color: #aaa;
    }
    #tooltip b { color: #ddd; }
    #tooltip .tape-row { letter-spacing: 2px; }
  </style>
</head>
<body>

<header>
  <h1>Artificial Life</h1>
  <a href="https://arxiv.org/abs/2406.19108" target="_blank">arxiv:2406.19108</a>
</header>

<div id="controls">
  <button id="btnToggle">&#9654; Start</button>
  <button id="btnStep">Step</button>
  <button id="btnReset">Reset</button>

  <div class="pill">
    <label>Grid:</label>
    <select id="gridSize">
      <option value="40x23">40×23  (tiny)</option>
      <option value="80x45" selected>80×45  (small)</option>
      <option value="120x68">120×68 (medium)</option>
      <option value="160x90">160×90 (large)</option>
      <option value="240x135">240×135 (full)</option>
    </select>
  </div>

  <div class="pill">
    <label>Speed:</label>
    <input type="range" id="speed" min="1" max="30" value="5">
    <span class="val" id="speedVal">5 ep/f</span>
  </div>

  <div class="pill">
    <label>Mutation:</label>
    <input type="range" id="mutRate" min="0" max="200" value="24">
    <span class="val" id="mutRateVal">0.0240%</span>
  </div>

  <div class="pill">
    <label>Seed:</label>
    <input type="number" id="seed" value="1" min="0" max="99999">
  </div>
</div>

<div id="stats">
  <span>Epoch: <span class="val" id="sEpoch">0</span></span>
  <span>Opcodes: <span class="val" id="sOpcodes">—</span></span>
  <span>Pairs/ep: <span class="val" id="sPairs">—</span></span>
  <span>ep/s: <span class="val" id="sEps">—</span></span>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="zoom">
    <canvas id="zoomCanvas" width="8" height="8"></canvas>
    <div id="zoom-label"></div>
  </div>
</div>

<div id="legend"></div>
<div id="tooltip"></div>

<script>
(() => {
'use strict';

// ── Opcodes (ASCII) ──────────────────────────────────────────────────────────
const LT     = 60;   // <
const GT     = 62;   // >
const LB     = 123;  // {
const RB     = 125;  // }
const MINUS  = 45;   // -
const PLUS   = 43;   // +
const DOT    = 46;   // .
const COMMA  = 44;   // ,
const LBRACK = 91;   // [
const RBRACK = 93;   // ]

const OPCODE_TOKENS = [LT, GT, LB, RB, MINUS, PLUS, DOT, COMMA, LBRACK, RBRACK];
const OPCODE_NAMES  = ['<', '>', '{', '}', '-',  '+',  '.',  ',',  '[',   ']'];

// ── Color palette (matching original Python) ─────────────────────────────────
const PALETTE = [
  [239,  71, 111],  // <   red-pink
  [255, 209, 102],  // >   orange
  [  6, 214, 160],  // {   teal
  [ 17, 138, 178],  // }   blue
  [255, 127,  80],  // -   coral
  [131,  56, 236],  // +   purple
  [ 58, 134, 255],  // .   light blue
  [255, 190,  11],  // ,   yellow
  [139, 201,  38],  // [   green
  [255,  89,  94],  // ]   red
  [ 20,  20,  20],  // data dark gray
];

// Pre-built flat color lookup: byte -> [r, g, b] stored as typed array for speed
const COLOR_LUT_R = new Uint8Array(256).fill(20);
const COLOR_LUT_G = new Uint8Array(256).fill(20);
const COLOR_LUT_B = new Uint8Array(256).fill(20);
OPCODE_TOKENS.forEach((tok, i) => {
  COLOR_LUT_R[tok] = PALETTE[i][0];
  COLOR_LUT_G[tok] = PALETTE[i][1];
  COLOR_LUT_B[tok] = PALETTE[i][2];
});

// IS_OPCODE lookup for fast counting
const IS_OPCODE = new Uint8Array(256);
OPCODE_TOKENS.forEach(tok => { IS_OPCODE[tok] = 1; });

// ── Simple deterministic RNG (mulberry32) ────────────────────────────────────
function makePRNG(seed) {
  let s = seed >>> 0;
  return function() {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ── Simulation state ─────────────────────────────────────────────────────────
const TAPE_SIZE  = 64;
const MAX_ITER   = 8192;

let WIDTH, HEIGHT, N;
let programs;        // Uint8Array [N * TAPE_SIZE]
let neighbors;       // Int32Array [N * 24]
let neighborCounts;  // Int32Array [N]
let proposals;       // Int32Array [N]
let orderBuf;        // Int32Array [N]  – reused each epoch
let pairsBuf;        // Int32Array [N]  – flat [a0,b0, a1,b1, ...]
let takenBuf;        // Uint8Array [N]
let concatTape;      // Uint8Array [TAPE_SIZE*2]

let epoch     = 0;
let running   = false;
let animId    = 0;
let rng;

// Perf tracking
let perfEpochs = 0;
let perfT0     = 0;
let lastPairCount = 0;

// ── Build neighborhood (5×5 window, excluding self) ──────────────────────────
function buildNeighborhood() {
  for (let x = 0; x < WIDTH; x++) {
    const xLo = Math.max(0, x - 2);
    const xHi = Math.min(WIDTH, x + 3);
    for (let y = 0; y < HEIGHT; y++) {
      const yLo = Math.max(0, y - 2);
      const yHi = Math.min(HEIGHT, y + 3);
      const idx = x * HEIGHT + y;
      let cnt = 0;
      for (let nx = xLo; nx < xHi; nx++) {
        for (let ny = yLo; ny < yHi; ny++) {
          if (nx === x && ny === y) continue;
          neighbors[idx * 24 + cnt] = nx * HEIGHT + ny;
          cnt++;
        }
      }
      neighborCounts[idx] = cnt;
    }
  }
}

// ── Initialise simulation ────────────────────────────────────────────────────
function init() {
  const [w, h] = document.getElementById('gridSize').value.split('x').map(Number);
  WIDTH  = w;
  HEIGHT = h;
  N      = w * h;

  const seedVal = (parseInt(document.getElementById('seed').value, 10) || 1) >>> 0;
  rng = makePRNG(seedVal);

  programs       = new Uint8Array(N * TAPE_SIZE);
  neighbors      = new Int32Array(N * 24).fill(-1);
  neighborCounts = new Int32Array(N);
  proposals      = new Int32Array(N);
  orderBuf       = new Int32Array(N);
  pairsBuf       = new Int32Array(N);   // at most N/2 pairs → N ints
  takenBuf       = new Uint8Array(N);
  concatTape     = new Uint8Array(TAPE_SIZE * 2);

  // Randomise programs
  for (let i = 0; i < programs.length; i++) {
    programs[i] = (rng() * 256) | 0;
  }

  buildNeighborhood();

  epoch = 0;
  perfEpochs = 0;
  perfT0 = performance.now();
  lastPairCount = 0;

  resizeCanvas();
  render();
  updateStats();
}

function resizeCanvas() {
  canvas.width  = WIDTH  * 8;
  canvas.height = HEIGHT * 8;
  // Scale canvas to fit screen width while keeping aspect ratio
  const maxW = Math.min(window.innerWidth - 16, 1280);
  const scale = Math.min(1, maxW / canvas.width);
  canvas.style.width  = (canvas.width  * scale) + 'px';
  canvas.style.height = (canvas.height * scale) + 'px';
}

// ── Core interpreter ─────────────────────────────────────────────────────────
//
// This is a direct port of run_tape() from main.py.
// The tape (128 bytes = two programs concatenated) is both the program being
// executed and the memory. head0 & head1 are data pointers; pc is the program
// counter. All three start at 0. Bracket matching uses a linear scan (seekMatch)
// identical to the Python seek_match() inner function.

function seekMatch(tape, pc, step, openTok, closeTok) {
  const len = tape.length;
  let depth = 1;
  pc += step;
  while (pc >= 0 && pc < len && depth > 0) {
    const op = tape[pc];
    if      (op === openTok)  depth++;
    else if (op === closeTok) depth--;
    pc += step;
  }
  return depth === 0 ? pc - step : -1;
}

function runTape(tape) {
  const len = tape.length;
  let pc = 0, head0 = 0, head1 = 0;

  for (let iter = 0; iter < MAX_ITER; iter++) {
    if (pc < 0 || pc >= len) break;
    const op = tape[pc];

    if (op === LT) {
      head0 = (head0 === 0) ? len - 1 : head0 - 1;
    } else if (op === GT) {
      head0 = (head0 + 1 === len) ? 0 : head0 + 1;
    } else if (op === LB) {
      head1 = (head1 === 0) ? len - 1 : head1 - 1;
    } else if (op === RB) {
      head1 = (head1 + 1 === len) ? 0 : head1 + 1;
    } else if (op === MINUS) {
      tape[head0] = (tape[head0] - 1) & 0xFF;
    } else if (op === PLUS) {
      tape[head0] = (tape[head0] + 1) & 0xFF;
    } else if (op === DOT) {
      tape[head1] = tape[head0];
    } else if (op === COMMA) {
      tape[head0] = tape[head1];
    } else if (op === LBRACK && tape[head0] === 0) {
      pc = seekMatch(tape, pc, 1, LBRACK, RBRACK);
      if (pc < 0) break;
    } else if (op === RBRACK && tape[head0] !== 0) {
      pc = seekMatch(tape, pc, -1, RBRACK, LBRACK);
      if (pc < 0) break;
    }
    pc++;
  }
}

// ── One simulation epoch ─────────────────────────────────────────────────────
function runEpoch() {
  // 1. Produce a random visitation order (Fisher-Yates in-place)
  for (let i = 0; i < N; i++) orderBuf[i] = i;
  for (let i = N - 1; i > 0; i--) {
    const j = (rng() * (i + 1)) | 0;
    const tmp = orderBuf[i];
    orderBuf[i] = orderBuf[j];
    orderBuf[j] = tmp;
  }

  // 2. Each program proposes a random neighbor
  for (let i = 0; i < N; i++) {
    const cnt = neighborCounts[i];
    proposals[i] = cnt > 0 ? neighbors[i * 24 + ((rng() * cnt) | 0)] : -1;
  }

  // 3. Greedy non-conflicting pair selection
  takenBuf.fill(0);
  let pairCount = 0;
  for (let i = 0; i < N; i++) {
    const p = orderBuf[i];
    const n = proposals[p];
    if (n < 0 || takenBuf[p] || takenBuf[n]) continue;
    takenBuf[p] = 1;
    takenBuf[n] = 1;
    pairsBuf[pairCount * 2    ] = p;
    pairsBuf[pairCount * 2 + 1] = n;
    pairCount++;
  }
  lastPairCount = pairCount;

  // 4. Execute each pair
  for (let pi = 0; pi < pairCount; pi++) {
    const idxA  = pairsBuf[pi * 2    ];
    const idxB  = pairsBuf[pi * 2 + 1];
    const baseA = idxA * TAPE_SIZE;
    const baseB = idxB * TAPE_SIZE;

    // Concatenate → run → split back
    concatTape.set(programs.subarray(baseA, baseA + TAPE_SIZE), 0);
    concatTape.set(programs.subarray(baseB, baseB + TAPE_SIZE), TAPE_SIZE);
    runTape(concatTape);
    programs.set(concatTape.subarray(0, TAPE_SIZE), baseA);
    programs.set(concatTape.subarray(TAPE_SIZE),    baseB);
  }

  // 5. Background mutation
  const mutRate = parseInt(document.getElementById('mutRate').value, 10) / 100000;
  if (mutRate > 0) {
    // Expected number of mutations ~ Poisson(N * TAPE_SIZE * mutRate)
    const expected = programs.length * mutRate;
    // Draw from Poisson via normal approximation for large lambda, exact for small
    let numMut;
    if (expected < 30) {
      // Exact Poisson via Knuth's algorithm
      const L = Math.exp(-expected);
      let k = 0, p = 1;
      do { p *= rng(); k++; } while (p > L);
      numMut = k - 1;
    } else {
      numMut = Math.round(expected + Math.sqrt(expected) * (rng() * 2 - 1) * 1.7);
      numMut = Math.max(0, numMut);
    }
    for (let m = 0; m < numMut; m++) {
      programs[(rng() * programs.length) | 0] = (rng() * 256) | 0;
    }
  }

  epoch++;
  perfEpochs++;
}

// ── Rendering ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d', { alpha: false });
let imageData = null;

function render() {
  if (!imageData || imageData.width !== canvas.width || imageData.height !== canvas.height) {
    imageData = ctx.createImageData(canvas.width, canvas.height);
    // Set alpha channel to 255 once
    const d = imageData.data;
    for (let i = 3; i < d.length; i += 4) d[i] = 255;
  }

  const pix  = imageData.data;
  const cw8  = canvas.width;   // = WIDTH * 8

  for (let x = 0; x < WIDTH; x++) {
    const px0 = x * 8;
    for (let y = 0; y < HEIGHT; y++) {
      const base = (x * HEIGHT + y) * TAPE_SIZE;
      const py0  = y * 8;
      for (let by = 0; by < 8; by++) {
        const row = py0 + by;
        const rowOff = row * cw8;
        const tapeRow = by * 8;
        for (let bx = 0; bx < 8; bx++) {
          const byte = programs[base + tapeRow + bx];
          const off  = (rowOff + px0 + bx) * 4;
          pix[off    ] = COLOR_LUT_R[byte];
          pix[off + 1] = COLOR_LUT_G[byte];
          pix[off + 2] = COLOR_LUT_B[byte];
          // alpha already 255
        }
      }
    }
  }
  ctx.putImageData(imageData, 0, 0);
}

// ── Stats update ─────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('sEpoch').textContent = epoch;
  document.getElementById('sPairs').textContent = lastPairCount > 0 ? lastPairCount : '—';

  // Opcode percentage
  let opcodeCount = 0;
  for (let i = 0; i < programs.length; i++) opcodeCount += IS_OPCODE[programs[i]];
  const pct = (100 * opcodeCount / programs.length).toFixed(2);
  document.getElementById('sOpcodes').textContent = pct + '%';

  // Epochs per second
  const dt = performance.now() - perfT0;
  if (dt > 500) {
    const eps = (perfEpochs / dt * 1000).toFixed(1);
    document.getElementById('sEps').textContent = eps;
    perfEpochs = 0;
    perfT0 = performance.now();
  }
}

// ── Animation loop ───────────────────────────────────────────────────────────
function loop() {
  if (!running) return;
  const epf = parseInt(document.getElementById('speed').value, 10);
  for (let i = 0; i < epf; i++) runEpoch();
  render();
  updateStats();
  animId = requestAnimationFrame(loop);
}

// ── Controls ─────────────────────────────────────────────────────────────────
const btnToggle = document.getElementById('btnToggle');

btnToggle.addEventListener('click', () => {
  running = !running;
  if (running) {
    btnToggle.textContent = '⏸ Pause';
    btnToggle.classList.add('active');
    perfT0 = performance.now();
    perfEpochs = 0;
    loop();
  } else {
    btnToggle.textContent = '▶ Start';
    btnToggle.classList.remove('active');
    cancelAnimationFrame(animId);
  }
});

document.getElementById('btnStep').addEventListener('click', () => {
  if (running) return;
  runEpoch();
  render();
  updateStats();
});

document.getElementById('btnReset').addEventListener('click', () => {
  const wasRunning = running;
  running = false;
  cancelAnimationFrame(animId);
  btnToggle.textContent = '▶ Start';
  btnToggle.classList.remove('active');
  init();
  if (wasRunning) {
    running = true;
    btnToggle.textContent = '⏸ Pause';
    btnToggle.classList.add('active');
    loop();
  }
});

document.getElementById('speed').addEventListener('input', function () {
  document.getElementById('speedVal').textContent = this.value + ' ep/f';
});

document.getElementById('mutRate').addEventListener('input', function () {
  const pct = (parseInt(this.value, 10) / 100000 * 100).toFixed(4);
  document.getElementById('mutRateVal').textContent = pct + '%';
});

document.getElementById('gridSize').addEventListener('change', () => {
  const wasRunning = running;
  running = false;
  cancelAnimationFrame(animId);
  btnToggle.textContent = '▶ Start';
  btnToggle.classList.remove('active');
  init();
  if (wasRunning) {
    running = true;
    btnToggle.textContent = '⏸ Pause';
    btnToggle.classList.add('active');
    loop();
  }
});

// ── Hover tooltip & zoom ─────────────────────────────────────────────────────
const zoomEl      = document.getElementById('zoom');
const zoomCanvas  = document.getElementById('zoomCanvas');
const zoomCtx     = zoomCanvas.getContext('2d', { alpha: false });
const zoomLabel   = document.getElementById('zoom-label');
const tooltipEl   = document.getElementById('tooltip');
let zoomImgData   = zoomCtx.createImageData(8, 8);

canvas.addEventListener('mousemove', (e) => {
  const rect  = canvas.getBoundingClientRect();
  const scaleX = canvas.width  / rect.width;
  const scaleY = canvas.height / rect.height;
  const mx = (e.clientX - rect.left) * scaleX | 0;
  const my = (e.clientY - rect.top)  * scaleY | 0;
  const gx = (mx / 8) | 0;
  const gy = (my / 8) | 0;
  if (gx >= WIDTH || gy >= HEIGHT) { zoomEl.style.display = 'none'; return; }

  const idx  = gx * HEIGHT + gy;
  const base = idx * TAPE_SIZE;

  // Update zoom canvas
  const zp = zoomImgData.data;
  for (let by = 0; by < 8; by++) {
    for (let bx = 0; bx < 8; bx++) {
      const byte = programs[base + by * 8 + bx];
      const off  = (by * 8 + bx) * 4;
      zp[off    ] = COLOR_LUT_R[byte];
      zp[off + 1] = COLOR_LUT_G[byte];
      zp[off + 2] = COLOR_LUT_B[byte];
      zp[off + 3] = 255;
    }
  }
  zoomCtx.putImageData(zoomImgData, 0, 0);

  // Tape as text (opcodes shown, data as ·)
  let rows = [];
  for (let r = 0; r < 8; r++) {
    let row = '';
    for (let c = 0; c < 8; c++) {
      const b = programs[base + r * 8 + c];
      const oi = OPCODE_TOKENS.indexOf(b);
      row += oi >= 0 ? OPCODE_NAMES[oi] : '·';
    }
    rows.push(row);
  }

  zoomLabel.innerHTML = `[${gx},${gy}]<br>${rows.map(r =>
    `<span class="tape-row">${r}</span>`).join('<br>')}`;
  zoomEl.style.display = 'block';
});

canvas.addEventListener('mouseleave', () => {
  zoomEl.style.display = 'none';
});

// ── Legend ───────────────────────────────────────────────────────────────────
const legendEl = document.getElementById('legend');
OPCODE_NAMES.forEach((name, i) => {
  const [r, g, b] = PALETTE[i];
  const div = document.createElement('div');
  div.className = 'li';
  div.innerHTML = `<div class="lc" style="background:rgb(${r},${g},${b})"></div><span>${name}</span>`;
  legendEl.appendChild(div);
});
// data
const dataDiv = document.createElement('div');
dataDiv.className = 'li';
dataDiv.innerHTML = `<div class="lc" style="background:#141414;border:1px solid #333"></div><span>data</span>`;
legendEl.appendChild(dataDiv);

// ── Kick off ─────────────────────────────────────────────────────────────────
window.addEventListener('resize', resizeCanvas);
init();

})();
</script>
</body>
</html>
